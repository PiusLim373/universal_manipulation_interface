# robospec_umi container.
#
#   export ROBOSPEC_UMI_DIRECTORY=/path/to/universal_manipulation_interface
#   export ROBOSPEC_UID=$(id -u) ROBOSPEC_GID=$(id -g)   # only if `id -u` is not 1000
#   xhost +local:docker                       # only if you want cv2.imshow
#   docker compose -f robospec_umi/robospec_umi_compose.yaml build
#   docker compose -f robospec_umi/robospec_umi_compose.yaml up -d --force-recreate
#   docker compose -f robospec_umi/robospec_umi_compose.yaml exec robospec bash
#
# The UI is at http://localhost:8080 (a placeholder until robospec_umi_ui/ has a
# dist/).

services:
  robospec:
    # :? fails with a readable message when the variable is unset, rather than
    # silently building from the current directory or binding an empty path.
    build:
      context: ${ROBOSPEC_UMI_DIRECTORY:?set ROBOSPEC_UMI_DIRECTORY to the repo root}
      dockerfile: robospec_umi/robospec_umi.Dockerfile
      args:
        # NOT ${UID}: bash marks UID readonly, so `export UID=$(id -u)` errors,
        # and an unexported shell variable never reaches compose anyway. This is
        # only the image's default account; `user:` below is what runs.
        UID: "${ROBOSPEC_UID:-1000}"
        GID: "${ROBOSPEC_GID:-1000}"
    image: ghcr.io/piuslim373/robospec-umi:oct_2026
    container_name: robospec_umi

    # Run as the host user, chosen when the container starts rather than when the
    # image is built: one image then works where `id -u` is not 1000 (a GCP VM),
    # and everything the server and `docker exec` write under data/ is yours.
    user: "${ROBOSPEC_UID:-1000}:${ROBOSPEC_GID:-1000}"
    # the image's own user is in these; a different UID needs them for the
    # cameras and the gripper's serial port
    group_add: [video, plugdev, audio]

    # The cameras need real device access: V4L2 ioctls for the scene camera, and
    # USB resets plus firmware queries for the RealSense. This does mean the
    # container is not a security boundary.
    privileged: true
    volumes:
      - /dev:/dev
      # cv2.imshow draws on the host's X server through this socket.
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
      - /etc/localtime:/etc/localtime:ro
      # The whole repo, so code edits are live and data/ writes land on the host.
      - ${ROBOSPEC_UMI_DIRECTORY}:/workspace
      # The UI again, separately, so it can be relocated outside the repo without
      # touching anything else. Docker resolves the more specific mount, so UI
      # edits on the host are live in the container -- no rebuild while iterating.
      - ${ROBOSPEC_UMI_UI_DIRECTORY:-${ROBOSPEC_UMI_DIRECTORY}/robospec_umi/robospec_umi_ui}:/workspace/robospec_umi/robospec_umi_ui

    # Docker's default /dev/shm is 64 MB. A PyTorch DataLoader with workers runs
    # out and the workers die as "DataLoader worker (pid N) is killed by signal:
    # Bus error" -- which reads like a bug in the training code rather than a
    # container setting. Training needs this.
    shm_size: '8gb'

    environment:
      # a UID with no account in the image has no home; caches land in /tmp
      HOME: /tmp
      DISPLAY: ${DISPLAY:-:0}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,video
      NVIDIA_VISIBLE_DEVICES: all

    ports:
      - "8080:8080"

    # Host GPU. `video` alongside gpu/compute is what makes h264_nvenc work; see
    # the note in the Dockerfile.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, video, utility, compute]

    stdin_open: true
    tty: true
    restart: unless-stopped
